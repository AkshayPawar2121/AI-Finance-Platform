# Application Name
spring.application.name=nextgendemo

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Server Configuration
server.port=8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ai_finance_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=ai_finance_platform
spring.datasource.password=root@123
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Debugging and Logging
debug=true
logging.level.org.springframework.boot=INFO
logging.level.root=WARN

# Validation
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
